services:
    tello_suite:
        image: robot_suite:tello
        container_name: tello_suite
        build:
            context: .
            dockerfile: ./docker/tello/Dockerfile
        environment:
            - DISPLAY=${DISPLAY}
            - LIBGL_ALWAYS_SOFTWARE=1
            #- RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
            - /dev/dri:/dev/dri  # for hardware acceleration
        devices:
            - /dev/snd:/dev/snd
        network_mode: "host"
        tty: true
        stdin_open: true
        command: "ros2 launch robot_bringup tello_launch.py"
    spot_suite:
        image: ros:jazzy
        container_name: spot_suite_jazzy
        build:
            context: .
            dockerfile: ./docker/spot/Dockerfile
        environment:
            - DISPLAY=${DISPLAY}
            #- RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
        devices:
            - /dev/snd:/dev/snd
        network_mode: "host"
        tty: true
        stdin_open: true
        command: "ros2 launch robot_bringup spot_launch.py"
