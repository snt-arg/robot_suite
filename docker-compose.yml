services:
    tello_suite:
        image: robot_suite:tello
        container_name: tello_suite
        build:
            context: .
            dockerfile: ./docker/tello/Dockerfile
        environment:
            - DISPLAY=${DISPLAY}
            #- RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
        network_mode: "host"
        tty: true
        stdin_open: true
        command: "ros2 launch robot_bringup system_launch.py"
    spot_suite:
        image: ros:jazzy
        container_name: spot_suite_jazzy
        build:
            context: .
            dockerfile: ./docker/spot/Dockerfile
        environment:
            - DISPLAY=${DISPLAY}
            #- RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
            #- /home/aerolabws2/workspaces/robot_suite_ingrid/spot_sdk_install:/spot_sdk_install:ro
        network_mode: "host"
        tty: true
        stdin_open: true
        command: "ros2 launch robot_bringup system_launch.py"
